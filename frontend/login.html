<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foody | Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body data-page="login">
  <div class="app-shell">
    <nav class="navbar">
      <div class="brand" onclick="window.location.href='index.html'">
        <span class="brand-mark"><i data-lucide="utensils"></i></span>
        <span>Foody</span>
      </div>
      <ul id="navLinks"></ul>
    </nav>

    <main class="auth-page">
      <form id="loginForm" class="panel auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Login</h1>
        <p class="muted">Continue ordering your favourite food.</p>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" class="input" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" class="input" type="password" placeholder="Your password" required />
        </div>

        <button class="btn btn-primary" type="submit" style="width:100%;">
          <i data-lucide="log-in"></i>Login
        </button>

        <p class="auth-switch">New here? <a href="register.html">Create account</a></p>
      </form>
    </main>
  </div>
</body>
</html>
