<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foody | Orders</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/orders.js"></script>
</head>
<body data-page="orders">
  <div class="app-shell">
    <nav class="navbar">
      <div class="brand" onclick="window.location.href='index.html'">
        <span class="brand-mark"><i data-lucide="utensils"></i></span>
        <span>Foody</span>
      </div>
      <ul id="navLinks"></ul>
    </nav>

    <main class="page">
      <section class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">Tracking</p>
            <h2>Your Orders</h2>
            <p class="muted">Status refreshes automatically while the page is open.</p>
          </div>
        </div>

        <div class="split-grid">
          <div>
            <div id="ordersList"></div>
            <div id="emptyOrders" class="empty" style="display:none;">
              <div>
                <i data-lucide="package-open"></i>
                <h2>No orders yet</h2>
                <p>Your first order will show up here.</p>
              </div>
            </div>
          </div>

          <aside class="panel" id="ordersMapPanel" style="display:none;">
            <h3 id="ordersMapTitle">Tracking order</h3>
            <div id="ordersMap" class="map"></div>
            <div id="ordersEta" class="eta-box" style="display:none;"></div>
          </aside>
        </div>
      </section>
    </main>

    <div id="chatbotRoot"></div>
    <footer class="footer">Foody 2026.</footer>
  </div>
</body>
</html>
