<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foody | Register</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body data-page="register">
  <div class="app-shell">
    <nav class="navbar">
      <div class="brand" onclick="window.location.href='index.html'">
        <span class="brand-mark"><i data-lucide="utensils"></i></span>
        <span>Foody</span>
      </div>
      <ul id="navLinks"></ul>
    </nav>

    <main class="auth-page">
      <form id="registerForm" class="panel auth-card">
        <p class="eyebrow">Start ordering</p>
        <h1>Create Account</h1>
        <p class="muted">Register as a customer and add addresses from your profile.</p>

        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" class="input" type="text" placeholder="Full name" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" class="input" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input id="phone" class="input" type="tel" placeholder="Phone number" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" class="input" type="password" placeholder="Minimum 6 characters" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" class="input" type="password" placeholder="Repeat password" required />
        </div>

        <button class="btn btn-primary" type="submit" style="width:100%;">
          <i data-lucide="user-plus"></i>Register
        </button>

        <p class="auth-switch">Already registered? <a href="login.html">Login</a></p>
      </form>
    </main>
  </div>
</body>
</html>
