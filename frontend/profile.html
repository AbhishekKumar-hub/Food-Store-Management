<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foody | Profile</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/profile.js"></script>
</head>
<body data-page="profile">
  <div class="app-shell">
    <nav class="navbar">
      <div class="brand" onclick="window.location.href='index.html'">
        <span class="brand-mark"><i data-lucide="utensils"></i></span>
        <span>Foody</span>
      </div>
      <ul id="navLinks"></ul>
    </nav>

    <main class="page">
      <section class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">Account</p>
            <h2>Edit Profile</h2>
            <p class="muted">Keep your contact details and delivery pins ready for checkout.</p>
          </div>
        </div>

        <div class="split-grid">
          <div>
            <form id="profileForm" class="panel form-grid">
              <div class="full">
                <h3>Personal Details</h3>
              </div>
              <input id="profileName" class="input" placeholder="Name" required />
              <input id="profilePhone" class="input" placeholder="Phone" />
              <input id="profileEmail" class="input full" placeholder="Email" disabled />
              <button class="btn btn-primary full" type="submit">
                <i data-lucide="save"></i>Save Profile
              </button>
            </form>

            <section style="margin-top:18px;">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Saved Places</p>
                  <h2>Addresses</h2>
                </div>
              </div>
              <div id="profileAddressList"></div>
            </section>

            <section style="margin-top:18px;">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Wishlist</p>
                  <h2>Favourite Dishes</h2>
                </div>
              </div>
              <div id="profileWishlist"></div>
            </section>
          </div>

          <aside class="panel">
            <form id="addressForm" class="form-grid">
              <input id="addressId" type="hidden" />
              <div class="full">
                <h3 id="addressFormTitle">Add Address</h3>
              </div>
              <input id="addressLabel" class="input" placeholder="Label, e.g. Home" />
              <input id="addressPincode" class="input" placeholder="Pincode" required />
              <input id="addressLine1" class="input full" placeholder="Address line" required />
              <input id="addressLandmark" class="input full" placeholder="Landmark" />
              <input id="addressCity" class="input" placeholder="City" required />
              <input id="addressState" class="input" placeholder="State" required />
              <input id="addressLat" class="input" placeholder="Latitude" readonly />
              <input id="addressLng" class="input" placeholder="Longitude" readonly />
              <label class="chip full"><input id="addressDefault" type="checkbox" /> Make default</label>
              <div id="profileAddressMap" class="map full"></div>
              <div class="form-actions full">
                <button class="btn btn-outline" id="addressLocationBtn" type="button">
                  <i data-lucide="crosshair"></i>Use current location
                </button>
                <button class="btn btn-primary" type="submit">
                  <i data-lucide="save"></i>Save Address
                </button>
                <button class="btn btn-ghost" id="clearAddressBtn" type="button">Clear</button>
              </div>
            </form>
          </aside>
        </div>
      </section>
    </main>

    <footer class="footer">Foody 2026.</footer>
  </div>
</body>
</html>
