<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foody | Product Details</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/product.js"></script>
</head>
<body data-page="home">
  <div class="app-shell">
    <nav class="navbar">
      <div class="brand" onclick="window.location.href='index.html'">
        <span class="brand-mark"><i data-lucide="utensils"></i></span>
        <span>Foody</span>
      </div>
      <ul id="navLinks"></ul>
    </nav>

    <main class="page">
      <section class="container" id="productContainer"></section>

      <section class="container" style="margin-top:24px;">
        <div class="section-head">
          <div>
            <p class="eyebrow">Reviews</p>
            <h2>Customer Feedback</h2>
          </div>
        </div>

        <div class="split-grid">
          <div class="panel">
            <div id="reviewsList" class="review-list"></div>
          </div>

          <form id="reviewForm" class="panel form-grid" style="display:none;">
            <div class="full">
              <h3>Share your review</h3>
              <p class="muted">Reviews are accepted only for products you ordered.</p>
            </div>
            <select id="rating" class="select full">
              <option value="">Select rating</option>
              <option value="5">5 - Excellent</option>
              <option value="4">4 - Good</option>
              <option value="3">3 - Average</option>
              <option value="2">2 - Needs work</option>
              <option value="1">1 - Poor</option>
            </select>
            <textarea id="comment" class="full" placeholder="Write your review"></textarea>
            <button type="button" class="btn btn-primary full" onclick="submitReview()">
              <i data-lucide="send"></i>Submit Review
            </button>
          </form>
        </div>
      </section>
    </main>

    <div id="chatbotRoot"></div>
    <footer class="footer">Foody 2026.</footer>
  </div>
</body>
</html>
